# Nginx bên trong docker compose: phục vụ /static/, /media/ và chuyển phần còn lại cho Django.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 40m;
    server_tokens off;

    root /srv;

    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    # Ảnh upload: chỉ phục vụ file ảnh, không thực thi bất cứ thứ gì.
    location /media/ {
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; script-src 'none'";
        location ~* \.(webp|jpe?g|png)$ { }
        location ~ . { return 404; }
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
    }
}
