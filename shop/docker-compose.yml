# Kenvin Shop - chạy trên Synology Container Manager (Project) hoặc docker compose.
# Dữ liệu nằm trong ./data (database + ảnh upload). Xem DEPLOY.md.
services:
  db:
    image: postgres:16-alpine
    container_name: kenvinshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: kenvinshop:latest
    container_name: kenvinshop-web
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data/media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    container_name: kenvinshop-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8687}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - web

volumes:
  static:
